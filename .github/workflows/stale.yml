name: Stale
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: pinned,bug
          stale-issue-message: "Задача без активности 60 дней. Закроется через 14 дней, если не будет обновлений."
          stale-pr-message: "PR без активности 60 дней. Закроется через 14 дней."
