# Alembic (issue #13). Бот сам применяет миграции при старте (bot/database/engine.py: init_models).
# Вручную, из корня проекта:
#   alembic upgrade head
#   alembic revision -m "описание"
# Адрес БД берётся из .env (bot/config.py), здесь его указывать не нужно.

[alembic]
script_location = bot/database/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
